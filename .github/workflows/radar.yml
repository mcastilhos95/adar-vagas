name: Radar de Vagas

on:
  schedule:
    - cron: "0 10,15,21 * * *"   # 07h, 12h e 18h em Porto Alegre (UTC-3)
  workflow_dispatch: {}           # botão "Run workflow" para rodar na hora

permissions:
  contents: write
  pages: write
  id-token: write

concurrency: { group: radar, cancel-in-progress: false }

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }

      - run: pip install -r requirements.txt

      - name: Coletar, dar nota, avisar e gerar painel
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_PARA: ${{ secrets.EMAIL_PARA }}
          LINK_PAINEL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python main.py

      - name: Guardar histórico (banco SQLite) no repositório
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add dados/radar.db
          git diff --cached --quiet || git commit -m "radar: atualização $(date -u +%F_%H%M)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

      - uses: actions/deploy-pages@v4
